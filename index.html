<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Lápiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Control de Dosis</h1>

        <div class="card display-card">
            <h2>Remanente Actual</h2>
            <div class="remaining-value">
                <span id="remanente">4.00</span> <span class="unit">ml</span>
            </div>
        </div>

        <div class="card input-card">
            <h3>Registrar Dosis</h3>
            <div class="input-group">
                <input type="number" id="dosis-input" step="0.01" min="0" placeholder="Ej: 0.25">
                <span class="unit-label">ml</span>
            </div>
            <button id="btn-aplicar" class="btn primary">Aplicar Dosis</button>
            <p id="error-msg" class="error"></p>
        </div>

        <div class="card history-card">
            <h3>Historial del Lápiz Actual</h3>
            <ul id="historial-lista">
                </ul>
        </div>

        <div class="card reset-card">
            <h3>¿Compraste un nuevo lápiz?</h3>
            <div class="input-group">
                <label for="capacidad-input">Capacidad del nuevo lápiz (ml):</label>
                <input type="number" id="capacidad-input" step="0.1" value="4.0" min="0.1">
            </div>
            <button id="btn-reiniciar" class="btn danger">Iniciar Nuevo Lápiz</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
